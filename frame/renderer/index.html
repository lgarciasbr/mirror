<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>Mirror Mind</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Wizard (1º acesso) ===== -->
<div class="wizard hidden" id="view-wizard">
  <div class="wiz-card">
    <div class="wiz-glyph">◇</div>
    <h1>Bem-vindo ao seu Mirror</h1>
    <p class="lead">Vamos preparar sua identidade local e ligar a memória. Leva um minuto —
    e tudo fica na sua máquina.</p>

    <div class="field">
      <label for="w-user">Seu nome (identidade local)</label>
      <input id="w-user" placeholder="ex.: Rodrigo">
      <p class="hint" id="w-user-hint"></p>
    </div>
    <div class="field">
      <label for="w-key">Chave OpenRouter (memória — embeddings e extração)</label>
      <input id="w-key" placeholder="sk-or-...">
      <p class="hint">Crie em openrouter.ai · a conversa usa sua assinatura via <code>/login</code> dentro do Pi</p>
    </div>
    <p class="wiz-msg" id="w-msg"></p>
    <div class="wiz-nav">
      <button class="btn primary" id="w-save">Salvar e continuar →</button>
    </div>
  </div>
</div>

<!-- ===== Frame principal ===== -->
<div class="frame hidden" id="view-frame">
  <div class="tabstrip" id="tabstrip"></div>
  <div class="frame-body">
    <div class="term-host" id="term-host"></div>
    <div class="panel hidden" id="panel-setup"></div>
    <div class="panel hidden" id="panel-personas"></div>
    <div class="empty hidden" id="empty-state">
      <div class="empty-inner">
        <div class="wiz-glyph">◇</div>
        <h2 id="empty-title">Preparando o Mirror…</h2>
        <p id="empty-msg" class="lead"></p>
        <div class="wiz-nav" style="justify-content:center">
          <button class="btn primary hidden" id="btn-open-session">Abrir sessão ◇</button>
          <button class="btn hidden" id="btn-goto-setup">Abrir o Setup ⚙</button>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar" id="statusbar"></div>
</div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
